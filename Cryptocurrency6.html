<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Cryptocurrency</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      color: #00ffcc;
    }

    label {
      font-size: 18px;
      display: block;
      margin-bottom: 10px;
    }

    #search-input {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
      background: #222;
      color: #fff;
    }

    select {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background: #222;
      color: #fff;
    }

    option {
      background: #222;
      color: #fff;
    }

    .crypto {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
    }

    .up {
      color: #00ff00;
    }

    .down {
      color: #ff3333;
    }
    
    #wallet-info {
      margin-top: 20px;
      font-size: 16px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Select a Cryptocurrency</h1>

  <label for="search-input">Search Cryptocurrency:</label>
  <input type="text" id="search-input" placeholder="Type to filter...">

  <select id="crypto-select">
    <option>Loading...</option>
  </select>

  <div id="crypto-info"></div>
  <div id="wallet-info"></div>
  <div id="global-info" style="margin-top: 20px;"></div>

  <script>
    const select = document.getElementById('crypto-select');
    const searchInput = document.getElementById('search-input');
    let allCoins = [];

    // Function to populate cryptocurrency list
    async function populateCryptoList() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/coins/list');
        const coins = await res.json();

        allCoins = coins.sort((a, b) => a.name.localeCompare(b.name));
        renderOptions(allCoins);
      } catch (err) {
        select.innerHTML = '<option>Error loading data</option>';
      }
    }

    // Function to render options in the dropdown list
    function renderOptions(filteredCoins) {
      select.innerHTML = '';
      filteredCoins.forEach(coin => {
        const option = document.createElement('option');
        option.value = coin.id;
        option.textContent = `${coin.name} (${coin.symbol.toUpperCase()})`;
        select.appendChild(option);
      });
    }

    // Handle search input and filter the coins
    searchInput.addEventListener('input', () => {
      const keyword = searchInput.value.toLowerCase();
      const filtered = allCoins.filter(coin =>
        coin.name.toLowerCase().includes(keyword) ||
        coin.symbol.toLowerCase().includes(keyword)
      );
      renderOptions(filtered);
    });

    // Fetch crypto data like price, volume, etc.
    async function fetchCryptoData(coin = "bitcoin") {
      const response = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${coin}`);
      const data = await response.json();

      const infoDiv = document.getElementById("crypto-info");
      infoDiv.innerHTML = '';

      data.forEach(coin => {
        const changeClass = coin.price_change_percentage_24h >= 0 ? 'up' : 'down';
        const high = coin.high_24h;
        const low = coin.low_24h;
        const close = coin.current_price;
        const P = (high + low + close) / 3;
        const R1 = (2 * P) - low;
        const S1 = (2 * P) - high;
        const R2 = P + (high - low);
        const S2 = P - (high - low);
        const R3 = high + 2 * (P - low);
        const S3 = low - 2 * (high - P);
        const trend = coin.price_change_percentage_24h > 0 ? "Bullish" : "Bearish";

        infoDiv.innerHTML += `
          <div class="crypto">
            <h2>${coin.name} (${coin.symbol.toUpperCase()})</h2>
            <p>Price: $${coin.current_price.toLocaleString()}</p>
            <p>24h Volume: $${coin.total_volume.toLocaleString()}</p>
            <p>Market Cap: $${coin.market_cap.toLocaleString()}</p>
            <p>24h High: $${high.toLocaleString()}</p>
            <p>24h Low: $${low.toLocaleString()}</p>
            <p class="${changeClass}">24h Change: ${coin.price_change_percentage_24h.toFixed(2)}%</p>
            <p><strong>Trend:</strong> ${trend}</p>
            <hr>
            <h3>Pivot Points (Standard)</h3>
            <p>P: $${P.toFixed(4)}</p>
            <p>R1: $${R1.toFixed(4)}</p>
            <p>S1: $${S1.toFixed(4)}</p>
            <p>R2: $${R2.toFixed(4)}</p>
            <p>S2: $${S2.toFixed(4)}</p>
            <p>R3: $${R3.toFixed(4)}</p>
            <p>S3: $${S3.toFixed(4)}</p>
          </div>
        `;
      });
    }

    // Fetch global market data (overall market info)
    async function fetchGlobalData() {
      const response = await fetch("https://api.coingecko.com/api/v3/global");
      const global = await response.json();
      const g = global.data;

      const globalDiv = document.getElementById("global-info");
      globalDiv.innerHTML = `
        <h2>Global Crypto Market</h2>
        <p>Total Market Cap: $${g.total_market_cap.usd.toLocaleString()}</p>
        <p>Total Volume (24h): $${g.total_volume.usd.toLocaleString()}</p>
        <p>Active Cryptocurrencies: ${g.active_cryptocurrencies}</p>
        <p>Market Cap BTC Dominance: ${g.market_cap_percentage.btc.toFixed(2)}%</p>
      `;
    }

    // Simulated function to fetch the number of wallets (This needs a real API for accurate data)
    async function fetchWalletData(coin = "bitcoin") {
      const wallets = Math.floor(Math.random() * 1000000);  // Simulated random wallet data
      const walletInfoDiv = document.getElementById("wallet-info");
      walletInfoDiv.innerHTML = `<p>Number of wallets holding ${coin}: ${wallets.toLocaleString()}</p>`;
    }

    // Update data when a cryptocurrency is selected
    select.addEventListener("change", () => {
      fetchCryptoData(select.value);
      fetchWalletData(select.value);
    });

    // Initial load
    populateCryptoList().then(() => fetchCryptoData());
    fetchGlobalData();
    fetchWalletData();

    // Set interval for live updates
    setInterval(() => {
      fetchCryptoData(select.value);
      fetchWalletData(select.value);
    }, 1000);  // Update every 1 second
  </script>
</body>
</html>
