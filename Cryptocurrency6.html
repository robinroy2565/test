<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As to As Jio Saavan</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: #fff;
        }
        header {
            background-color: #1db954;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        .search-bar {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }
        .search-bar input {
            width: 60%;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        .content {
            padding: 20px;
        }
        .featured {
            text-align: center;
            margin-bottom: 30px;
        }
        iframe {
            width: 100%;
            max-width: 600px;
            height: 300px;
            border: none;
            margin-top: 15px;
        }
        .playlist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .song {
            background-color: #222;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        footer {
            text-align: center;
            background-color: #1db954;
            padding: 15px;
            margin-top: 40px;
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>As to As Jio Saavan</h1>
        <p>Your Gateway to Non-Stop Music</p>
    </header>

    <div class="search-bar">
        <input type="text" placeholder="Search for songs, artists, albums...">
    </div>

    <div class="content">
        <div class="featured">
            <h2>Featured Track</h2>
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
        </div>

        <h2>Top Picks</h2>
        <div class="playlist">
            <div class="song">
                <p>Track 1</p>
                <p>Artist A</p>
            </div>
            <div class="song">
                <p>Track 2</p>
                <p>Artist B</p>
            </div>
            <div class="song">
                <p>Track 3</p>
                <p>Artist C</p>
            </div>
            <div class="song">
                <p>Track 4</p>
                <p>Artist D</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 As to As Jio Saavan. All rights reserved.</p>
    </footer>

</body>
</html>
