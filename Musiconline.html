<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioSaavn Clone</title>
    <link rel="stylesheet" href="style.css">
    <style>
      * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}
body {
    background: #121212;
    color: white;
    display: flex;
}
.container {
    display: flex;
    width: 100%;
    min-height: 100vh;
}
.sidebar {
    background: #1db954;
    width: 200px;
    padding: 20px;
}
.sidebar h1 {
    font-size: 24px;
    margin-bottom: 20px;
}
.sidebar ul {
    list-style: none;
}
.sidebar li {
    margin: 15px 0;
    cursor: pointer;
}
.main-content {
    flex: 1;
    padding: 30px;
    background: #181818;
}
.song-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 30px;
}
.song {
    background: #333;
    padding: 15px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.3s;
}
.song:hover {
    background: #444;
}
.player {
    background: #222;
    padding: 15px;
    border-radius: 5px;
}

    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>JioSaavn</h1>
            <nav>
                <ul>
                    <li>Home</li>
                    <li>Browse</li>
                    <li>Library</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h2>Top Picks</h2>
            <div class="song-list">
                <div class="song" data-src="songs/song1.mp3">Song 1 - Artist A</div>
                <div class="song" data-src="songs/song2.mp3">Song 2 - Artist B</div>
                <div class="song" data-src="songs/song3.mp3">Song 3 - Artist C</div>
            </div>

            <div class="player">
                <p id="now-playing">Select a song to play</p>
                <audio id="audio" controls></audio>
            </div>
        </main>
    </div>

    <script>
      const songs = document.querySelectorAll('.song');
const audio = document.getElementById('audio');
const nowPlaying = document.getElementById('now-playing');

songs.forEach(song => {
    song.addEventListener('click', () => {
        const src = song.getAttribute('data-src');
        audio.src = src;
        audio.play();
        nowPlaying.textContent = `Now Playing: ${song.textContent}`;
    });
});

    </script>
</body>
</html>
