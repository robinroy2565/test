<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      padding: 20px;
    }
    video, audio {
      margin: 20px 0;
      width: 100%;
      max-width: 600px;
    }
    .download-btn {
      display: inline-block;
      margin: 10px;
      padding: 10px 20px;
      background-color: #2c3e50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
    .download-btn:hover {
      background-color: #34495e;
    }
  </style>
</head>
<body>
  <h1>Media Player</h1>

  <!-- Video Player -->
  <h2>Video Player</h2>
  <video controls>
    <source src="media/sample-video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- MP3 Player -->
  <h2>MP3 Music Player</h2>
  <audio controls>
    <source src="media/sample-audio.mp3" type="audio/mp3" />
    Your browser does not support the audio tag.
  </audio>

  <!-- Download Buttons -->
  <h2>Download Music</h2>
  <a href="media/sample-audio.mp3" download class="download-btn">Download MP3</a>

  <!-- Optional Offline Note -->
  <p><strong>Note:</strong> This player works offline if the media files are stored locally in a "media" folder.</p>
</body>
</html>
