





<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 60%;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background-color: #e0f7fa;
            border: 1px solid #00796b;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Loan EMI Calculator</h1>
                <!-- Loan Period  -->
        <label for="loanPeriod">Loan Period(year)</label>
        <input type="number" id="loanPeriod" value="" oninput="updateEMINumberLimit()" />


        <!-- Loan EMI Type -->
        <label for="emiType">Loan EMI Type</label>
        <select id="emiType" onchange="updateEMINumberLabel(); updateEMINumberLimit();">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select>

        <!-- Loan Amount -->
        <label for="loanAmount">Loan Amount</label>
        <input type="number" id="loanAmount" value="" />

                <!-- Loan Type  -->
        <label for="loanType">Loan Type</label>
        <select id="loanType" onchange="updateInterestRate()">
            <option value="hide">loan Type</option>
            <option value="Agricultural Loan">Agricultural Loan</option>
            <option value="Employee Welfare Loan">Employee Welfare Loan</option>
            <option value="Gold Mortgage Loan">Gold Mortgage Loan</option>
            <option value="Property Mortgage Loan">Property Mortgage Loan</option>
            <option value="Scheme Mortgage Loan">Scheme Mortgage Loan</option>
            <option value="Small Business Credit Loan">Small Business Credit Loan</option>
   
        </select>


        <!-- Interest Rate -->
        <label for="interestRate">Interest Rate (%)</label>
        <input type="number" id="interestRate" value="" />

        <!-- EMI Number -->
        <label for="emiNumber" id="emiNumberLabel">EMI Number (Months)</label>
        <input type="number" id="emiNumber" value="" />

        <!-- Calculate Button -->
        <button class="button" onclick="calculateEMI()">Calculate EMI</button>

        <!-- Results Section -->
        <div class="result" id="result" style="display:none;">
            <h3>Loan Details</h3>
            <p><strong>Total Principal (Including Processing Charges):</strong> ₹<span id="loanAmountDetails"></span></p>
            <p><strong>Total Interest:</strong> ₹<span id="totalInterest"></span></p>
            <p><strong>EMI Amount:</strong> ₹<span id="emiAmount"></span></p>
            <p><strong>Total Repayment (Including Processing Charges):</strong> ₹<span id="totalRepayment"></span></p>
        </div>
    </div>
    

      <script>
                // Function to update the EMI Number label based on EMI type (Daily, Weekly, Monthly)
                function updateEMINumberLabel() {
                    const emiType = document.getElementById("emiType").value;
                    const emiNumberLabel = document.getElementById("emiNumberLabel");
        
                    if (emiType === "daily") {
                        emiNumberLabel.textContent = "EMI Number (Days)";
                    } else if (emiType === "weekly") {
                        emiNumberLabel.textContent = "EMI Number (Weeks)";
                    } else {
                        emiNumberLabel.textContent = "EMI Number (Months)";
                    }
                }
        
                function calculateEMI() {
            const loanAmount = parseFloat(document.getElementById("loanAmount").value);
            const interestRate = parseFloat(document.getElementById("interestRate").value);
            const loanPeriod = parseFloat(document.getElementById("loanPeriod").value); // years
            const interestRatePerPeriod = parseFloat(document.getElementById("emiNumber").value); // total EMI count (daily/weekly/monthly)
        
            if (!loanAmount || !interestRate || !loanPeriod || !interestRatePerPeriod) {
                alert("Please enter all values correctly.");
                return;
            }
        
            // Processing charge 3.5%
            const processingCharge = loanAmount * 0.035;
            const loanAmountWithCharges = loanAmount + processingCharge;
        
            // SIMPLE INTEREST
            const interest = loanAmount * (interestRate / 100) * loanPeriod;
        
            // Total Amount to Return
            const totalAmount = loanAmountWithCharges + interest;
        
            // EMI Amount (YOUR FORMULA)
            const emiAmount = totalAmount / interestRatePerPeriod;
        
            // Display results
            document.getElementById("loanAmountDetails").textContent = loanAmountWithCharges.toFixed(2);
            document.getElementById("totalInterest").textContent = interest.toFixed(2);
            document.getElementById("emiAmount").textContent = emiAmount.toFixed(2);
            document.getElementById("totalRepayment").textContent = totalAmount.toFixed(2);
        
            document.getElementById("result").style.display = "block";
        }


            // Auto-fill interest rate based on loan type
            function updateInterestRate() {
                const loanType = document.getElementById("loanType").value;
                const interestInput = document.getElementById("interestRate");
            
                const rates = {
                    "Agricultural Loan": 10.1,
                    "Employee Welfare Loan": 12.50,
                    "Gold Mortgage Loan": 11.40,
                    "Property Mortgage Loan": 16,
                    "Scheme Mortgage Loan": 13.52,
                    "Small Business Credit Loan": 30
                };
            
                if (rates[loanType]) {
                    interestInput.value = rates[loanType];
                    interestInput.readOnly = true;   // lock input
                    interestInput.style.background = "#e8e8e8";
                } else {
                    interestInput.value = "";
                    interestInput.readOnly = false;  // allow manual input
                    interestInput.style.background = "white";
                }
            }
         
                
              function updateEMINumberLimit() {
             const years = parseFloat(document.getElementById("loanPeriod").value);
             const emiType = document.getElementById("emiType").value;
             const emiNumberInput = document.getElementById("emiNumber");
         
             let maxLimit = 0;
         
             if (emiType === "daily") {
                 maxLimit = years * 365;
             } 
             else if (emiType === "weekly") {
                 maxLimit = years * 52;
             } 
             else {
                 maxLimit = years * 12;
             }
         
             // Show hint only (not restricting typing)
             emiNumberInput.placeholder = `Min 1 – Max ${maxLimit}`;
         
             // CUSTOM VALIDATION
             emiNumberInput.oninput = () => {
                 let val = parseInt(emiNumberInput.value);
         
                 if (isNaN(val)) return; // allow empty
         
                 if (val < 1) {
                     alert("❗ Minimum EMI count is 1");
                     emiNumberInput.value = 1;
                 } 
                 else if (val > maxLimit) {
                     alert(`❗ Maximum EMI allowed is ${maxLimit}`);
                     emiNumberInput.value = maxLimit;
                 }
             };
         }


    </script>

</body>
</html>
