<!DOCTYPE html>
<html>
<head>
    <title>Susangati.in Auto Refresh Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2a4d8f;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
    </style>

    <script>
        let refreshCount = 0;

        function refreshIframe() {
            refreshCount++;
            document.getElementById("autoFrame").src =
                document.getElementById("autoFrame").src;

            // Update display
            document.getElementById("status").innerHTML =
                "Refresh Count: " + refreshCount +
                " | Last Refresh: " + new Date().toLocaleTimeString();
        }

        setInterval(refreshIframe, 60000); // refresh every 60 seconds
    </script>
</head>

<body>

    <!-- Refresh info -->
    <div id="status">Refresh Count: 0 | Last Refresh: Not yet refreshed</div>

    <!-- Example timetable section -->
    <h2>Daily Time Table</h2>
    <table>
        <tr>
            <th>Time</th>
            <th>Activity</th>
        </tr>
        <tr>
            <td>09:00 AM</td>
            <td>Morning Session</td>
        </tr>
        <tr>
            <td>12:00 PM</td>
            <td>Lunch Break</td>
        </tr>
        <tr>
            <td>02:00 PM</td>
            <td>Afternoon Session</td>
        </tr>
        <tr>
            <td>05:00 PM</td>
            <td>Closing Time</td>
        </tr>
    </table>

    <!-- Your website auto-refresh -->
    <iframe id="autoFrame" src="https://susangati.in" 
            width="100%" height="500px" style="border:none;"></iframe>

</body>
</html>
