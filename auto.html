<!DOCTYPE html>
<html>
<head>
    <title>Background Auto Refresh - Susangati.in</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2a4d8f;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #333;
        }
        th, td {
            padding: 8px;
            text-align: center;
        }
        /* Hide iframe so refresh runs in background */
        #hiddenFrame {
            width: 0px;
            height: 0px;
            border: none;
            visibility: hidden;
        }
    </style>

    <script>
        let refreshCount = 0;

        function backgroundRefresh() {
            refreshCount++;

            // Reload hidden iframe (background refresh)
            document.getElementById("hiddenFrame").src =
                "https://susangati.in?time=" + new Date().getTime();

            // Update display
            document.getElementById("status").innerHTML =
                "Refresh Count: " + refreshCount +
                " | Last Refresh: " + new Date().toLocaleTimeString();
        }

        setInterval(backgroundRefresh, 60000);  // 60 seconds
    </script>
</head>

<body>

    <!-- Refresh status at top -->
    <div id="status">Refresh Count: 0 | Last Refresh: Not yet refreshed</div>

    <!-- Timetable -->
    <h2>Daily Time Table</h2>
    <table>
        <tr><th>Time</th><th>Activity</th></tr>
        <tr><td>09:00 AM</td><td>Morning Session</td></tr>
        <tr><td>12:00 PM</td><td>Lunch Break</td></tr>
        <tr><td>02:00 PM</td><td>Afternoon Session</td></tr>
        <tr><td>05:00 PM</td><td>Closing Time</td></tr>
    </table>

    <!-- Hidden iframe (background auto-refresh) -->
    <iframe id="hiddenFrame"></iframe>

</body>
</html>
