<!DOCTYPE html>
<html>
<head>
  <title>Auto Reload</title>

  <script>
    let timeLeft = 40;
    let reloadCount = 0;

    // Countdown every 1 second
    setInterval(function () {
      timeLeft--;
      document.getElementById("countdown").innerText = timeLeft;

      if (timeLeft <= 0) {
        reloadCount++;
        localStorage.setItem("reloadCount", reloadCount);
        location.reload(); // 🔄 reload same page
      }
    }, 1000);

    // Restore reload count after refresh
    window.onload = function () {
      reloadCount = Number(localStorage.getItem("reloadCount")) || 0;
      document.getElementById("reloadCount").innerText = reloadCount;
    };
  </script>

</head>

<body>

  <h2>🔄 Page will reload every <span id="countdown">40</span> seconds</h2>
  <h3>🔢 Total Reloads: <span id="reloadCount">0</span></h3>

</body>
</html>
