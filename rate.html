<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto Investment Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f2f2f2;
    }
    h2 {
      color: #333;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 150px;
    }
    button {
      padding: 10px 15px;
      margin: 10px 0;
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 80%;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }
    .output {
      margin-top: 20px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <h2>CoinSwitch Crypto Multi-Buy Calculator</h2>

  <div>
    <input type="number" id="amount" placeholder="Amount Invested (₹)" />
    <input type="number" id="rate" placeholder="Rate per Coin (₹)" />
    <button onclick="addPurchase()">Add Purchase</button>
  </div>

  <table id="purchaseTable">
    <tr>
      <th>Amount Invested (₹)</th>
      <th>Buy Rate (₹)</th>
      <th>Coins Bought</th>
    </tr>
  </table>

  <div>
    <input type="number" id="currentRate" placeholder="Current Rate (₹)" />
    <button onclick="calculate()">Calculate</button>
  </div>

  <div class="output" id="results"></div>

  <script>
    const purchases = [];

    function addPurchase() {
      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);
      if (!amount || !rate) return alert("Please enter valid numbers.");

      const coins = amount / rate;
      purchases.push({ amount, rate, coins });

      const table = document.getElementById('purchaseTable');
      const row = table.insertRow();
      row.insertCell(0).innerText = "₹" + amount.toFixed(2);
      row.insertCell(1).innerText = "₹" + rate.toFixed(2);
      row.insertCell(2).innerText = coins.toFixed(6);
      
      document.getElementById('amount').value = '';
      document.getElementById('rate').value = '';
    }

    function calculate() {
      if (purchases.length === 0) return alert("No purchases added.");

      const totalInvestment = purchases.reduce((sum, p) => sum + p.amount, 0);
      const totalCoins = purchases.reduce((sum, p) => sum + p.coins, 0);
      const averagePrice = totalInvestment / totalCoins;

      const currentRate = parseFloat(document.getElementById('currentRate').value);
      let resultText = `
        <strong>Total Investment:</strong> ₹${totalInvestment.toFixed(2)}<br/>
        <strong>Total Coins:</strong> ${totalCoins.toFixed(6)}<br/>
        <strong>Average Buy Price:</strong> ₹${averagePrice.toFixed(2)}<br/>
      `;

      if (currentRate) {
        const currentValue = totalCoins * currentRate;
        const profitLoss = currentValue - totalInvestment;
        const profitLossText = profitLoss >= 0 ? "Profit" : "Loss";
        resultText += `
          <strong>Current Rate:</strong> ₹${currentRate.toFixed(2)}<br/>
          <strong>Current Value:</strong> ₹${currentValue.toFixed(2)}<br/>
          <strong>${profitLossText}:</strong> ₹${profitLoss.toFixed(2)}
        `;
      }

      document.getElementById('results').innerHTML = resultText;
    }
  </script>

</body>
</html>
