<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Crypto Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; }
    h1 { color: #00ffcc; }
    .crypto { border: 1px solid #444; padding: 15px; margin-top: 10px; border-radius: 8px; background: #222; }
    .up { color: #00ff00; }
    .down { color: #ff3333; }
  </style>
</head>
<body>
  <h1>Live Crypto Currency Tracker</h1>
  <div id="crypto-info"></div>
  <div id="global-info" style="margin-top: 20px;"></div>

  <script>
    async function fetchCryptoData() {
      const response = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,bonk");
      const data = await response.json();

      const infoDiv = document.getElementById("crypto-info");
      infoDiv.innerHTML = '';

      data.forEach(coin => {
        const changeClass = coin.price_change_percentage_24h >= 0 ? 'up' : 'down';
        infoDiv.innerHTML += `
          <div class="crypto">
            <h2>${coin.name} (${coin.symbol.toUpperCase()})</h2>
            <p>Price: $${coin.current_price.toLocaleString()}</p>
            <p>Volume (24h): $${coin.total_volume.toLocaleString()}</p>
            <p>Market Cap: $${coin.market_cap.toLocaleString()}</p>
            <p class="${changeClass}">24h Change: ${coin.price_change_percentage_24h.toFixed(2)}%</p>
          </div>
        `;
      });
    }

    async function fetchGlobalData() {
      const response = await fetch("https://api.coingecko.com/api/v3/global");
      const global = await response.json();
      const g = global.data;

      const globalDiv = document.getElementById("global-info");
      globalDiv.innerHTML = `
        <h2>Global Crypto Market</h2>
        <p>Total Market Cap: $${g.total_market_cap.usd.toLocaleString()}</p>
        <p>Total Volume (24h): $${g.total_volume.usd.toLocaleString()}</p>
        <p>Active Cryptocurrencies: ${g.active_cryptocurrencies}</p>
        <p>Market Cap BTC Dominance: ${g.market_cap_percentage.btc.toFixed(2)}%</p>
      `;
    }

    fetchCryptoData();
    fetchGlobalData();
    setInterval(fetchCryptoData, 30000);  // refresh every 30 seconds
  </script>
</body>
</html>
