<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text to Speech Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      background: #f5f5f5;
      text-align: center;
    }

    input[type="text"] {
      width: 300px;
      padding: 10px;
      font-size: 16px;
    }

    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }

    .buttons {
      margin-top: 20px;
    }

    #animated-text {
      margin-top: 30px;
      font-size: 24px;
      color: #333;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <h1>Text to Speech Generator</h1>

  <input type="text" id="text-input" placeholder="Enter text here" />

  <div>
    <label for="voice-select">Voice:</label>
    <select id="voice-select">
      <option value="">Loading voices...</option>
    </select>
  </div>

  <div class="buttons">
    <button onclick="speakText()">▶ Generate</button>
    <button onclick="togglePause()" id="pause-btn">⏸ Pause</button>
    <button onclick="stopSpeech()">⏹ Stop</button>
    <button onclick="clearText()">🧹 Clear</button>
    <button id="save-btn" onclick="saveAudio()" disabled>⬇ Save Audio</button>
  </div>

  <div id="animated-text"></div>

  <script>
    const synth = window.speechSynthesis;
    const voiceSelect = document.getElementById('voice-select');
    const saveBtn = document.getElementById('save-btn');
    let voices = [];
    let currentUtterance = null;
    let animationInterval = null;
    let paused = false;

    function populateVoiceList() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';
      voices.forEach((voice, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang}) ${voice.default ? '[Default]' : ''}`;
        voiceSelect.appendChild(option);
      });
    }

    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // Recording support using Web Audio API
    let audioChunks = [];
    let mediaRecorder;
    let audioBlob;

    async function speakText() {
      stopSpeech();
      const text = document.getElementById('text-input').value;
      const selectedVoice = voices[voiceSelect.value];
      if (!text || !selectedVoice) return;

      // Setup animation
      let words = text.split(" ");
      let i = 0;
      const animatedDiv = document.getElementById('animated-text');

      animationInterval = setInterval(() => {
        if (i < words.length) {
          animatedDiv.textContent = words[i];
          i++;
        } else {
          clearInterval(animationInterval);
        }
      }, 300);

      // Start recording speech
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        saveBtn.disabled = false;
      };

      mediaRecorder.start();

      // Speak the text
      currentUtterance = new SpeechSynthesisUtterance(text);
      currentUtterance.voice = selectedVoice;

      currentUtterance.onend = () => {
        clearInterval(animationInterval);
        animatedDiv.textContent = '';
        paused = false;
        document.getElementById('pause-btn').textContent = '⏸ Pause';
        mediaRecorder.stop();
      };

      synth.speak(currentUtterance);
    }

    function togglePause() {
      if (synth.speaking && !paused) {
        synth.pause();
        clearInterval(animationInterval);
        document.getElementById('pause-btn').textContent = '▶ Resume';
        paused = true;
      } else if (paused) {
        synth.resume();
        document.getElementById('pause-btn').textContent = '⏸ Pause';
        paused = false;
      }
    }

    function stopSpeech() {
      if (synth.speaking || synth.paused) {
        synth.cancel();
        clearInterval(animationInterval);
        document.getElementById('animated-text').textContent = '';
        document.getElementById('pause-btn').textContent = '⏸ Pause';
        paused = false;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function clearText() {
      stopSpeech();
      document.getElementById('text-input').value = '';
      document.getElementById('animated-text').textContent = '';
      saveBtn.disabled = true;
    }

    function saveAudio() {
      if (!audioBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(audioBlob);
      a.download = 'tts-output.webm';
      a.click();
    }
  </script>

</body>
</html>
