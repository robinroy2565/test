<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text to Speech Generator with Recording</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      background: #f5f5f5;
      text-align: center;
    }
    input[type="text"] {
      width: 300px;
      padding: 10px;
      font-size: 16px;
    }
    select, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    .buttons {
      margin-top: 20px;
    }
    #animated-text {
      margin-top: 30px;
      font-size: 24px;
      color: #333;
      min-height: 30px;
    }
  </style>
</head>
<body>

<h1>Text to Speech Generator</h1>

<input type="text" id="text-input" placeholder="Enter text here" />

<div>
  <label for="voice-select">Voice:</label>
  <select id="voice-select">
    <option value="">Loading voices...</option>
  </select>
</div>

<div class="buttons">
  <button onclick="speakText()">▶ Generate</button>
  <button onclick="togglePause()" id="pause-btn" disabled>⏸ Pause</button>
  <button onclick="stopSpeech()" disabled>⏹ Stop</button>
  <button onclick="clearText()">🧹 Clear</button>
  <button id="save-btn" onclick="saveAudio()" disabled>⬇ Save Audio</button>
  <button id="play-recording-btn" onclick="playRecording()" >▶ Play Recording</button>

</div>

<div id="animated-text"></div>

<script>
  const synth = window.speechSynthesis;
  const voiceSelect = document.getElementById('voice-select');
  const saveBtn = document.getElementById('save-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const stopBtn = document.querySelector('button[onclick="stopSpeech()"]');
  let voices = [];
  let currentUtterance = null;
  let animationInterval = null;
  let paused = false;

  let mediaRecorder;
  let audioChunks = [];
  let audioBlob;

  // Populate voice list
  function populateVoiceList() {
    voices = synth.getVoices();
    voiceSelect.innerHTML = '';
    voices.forEach((voice, i) => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `${voice.name} (${voice.lang}) ${voice.default ? '[Default]' : ''}`;
      voiceSelect.appendChild(option);
    });
  }
  populateVoiceList();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
  }
  async function speakText() {
  stopSpeech();
  const text = document.getElementById('text-input').value.trim();
  const selectedVoice = voices[voiceSelect.value];
  if (!text || !selectedVoice) return alert('Please enter text and select a voice.');

  const animatedDiv = document.getElementById('animated-text');
  animatedDiv.textContent = '';

  // Setup utterance
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.voice = selectedVoice;

  // Start microphone recording
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      saveBtn.disabled = false;
    };
    mediaRecorder.start();
  } catch (err) {
    alert('Microphone access denied or not available.\nRecording disabled.');
    saveBtn.disabled = true;
  }

  // Word-by-word highlight
  currentUtterance.onboundary = function(event) {
    if (event.name === 'word') {
      const charIndex = event.charIndex;
      const spokenPortion = text.slice(0, charIndex);
      const remainingText = text.slice(charIndex);
      const currentWord = remainingText.split(/\s+/)[0] || '';
      animatedDiv.textContent = currentWord;
    }
  };

  // End of speech
  currentUtterance.onend = () => {
    animatedDiv.textContent = '';
    paused = false;
    pauseBtn.textContent = '⏸ Pause';
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  };

  synth.speak(currentUtterance);
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
  saveBtn.disabled = true;
}

  // End of speech
  currentUtterance.onend = () => {

    stopBtn.disabled = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
  };

  synth.speak(currentUtterance);
  pauseBtn.disabled = false;
  stopBtn.disabled = false;
  saveBtn.disabled = true;
}


  function togglePause() {
    if (!currentUtterance) return;
    if (synth.speaking && !paused) {
      synth.pause();
      clearInterval(animationInterval);
      pauseBtn.textContent = '▶ Resume';
      paused = true;
    } else if (paused) {
      synth.resume();
      pauseBtn.textContent = '⏸ Pause';
      paused = false;
    }
  }

  function stopSpeech() {
    if (synth.speaking || synth.paused) {
      synth.cancel();
      clearInterval(animationInterval);
      document.getElementById('animated-text').textContent = '';
      pauseBtn.textContent = '⏸ Pause';
      paused = false;
    }
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    pauseBtn.disabled = true;
    stopBtn.disabled = true;
  }

  function clearText() {
    stopSpeech();
    document.getElementById('text-input').value = '';
    document.getElementById('animated-text').textContent = '';
    saveBtn.disabled = true;
  }

  function saveAudio() {
    if (!audioBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(audioBlob);
    a.download = 'tts-output.webm';
    a.click();
  }
  function playRecording() {
  if (!audioBlob) return alert('No recording available to play.');
  const audioUrl = URL.createObjectURL(audioBlob);
  const audio = new Audio(audioUrl);
  audio.play();
  }
</script>

</body>
</html>
