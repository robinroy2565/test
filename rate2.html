<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crypto Investment Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f9f9f9;
    }
    h2 {
      color: #222;
    }
    input {
      padding: 8px;
      margin: 5px;
      width: 180px;
    }
    button {
      padding: 10px 15px;
      margin: 10px 5px 10px 0;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      margin-top: 20px;
      border-collapse: collapse;
      width: 100%;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    .output {
      margin-top: 20px;
      font-size: 1.1em;
    }
    .highlight {
      background-color: #e9ffe9;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>CoinSwitch Crypto Multi-Buy Calculator</h2>

  <div>
    <input type="number" id="amount" placeholder="Amount Invested (₹)" />
    <input type="number" id="rate" placeholder="Rate per Coin (₹)" />
    <button onclick="addPurchase()">Add Purchase</button>
    <button onclick="printData()">🖨️ Print All Data</button>
  </div>

  <div>
    <input type="number" id="currentRate" placeholder="Current Rate (₹)" />
    <button onclick="calculate()">Calculate</button>
    <button onclick="fetchCurrentRate()">↻ Update INR Market Rate</button>
  </div>

  <table id="purchaseTable">
    <tr>
      <th>Amount Invested (₹)</th>
      <th>Buy Rate (₹)</th>
      <th>Coins Bought</th>
    </tr>
  </table>

  <table id="summaryTable" style="display:none;">
    <tr class="highlight">
      <td colspan="3"><strong>Total Investment</strong>: ₹<span id="totalInvestment">0.00</span></td>
      <td><strong>Total Coins</strong>: <span id="totalCoins">0.000000</span></td>
      <td><strong>Avg. Buy Price</strong>: ₹<span id="avgPrice">0.00</span></td>
    </tr>
  </table>

  <div class="output" id="results"></div>

  <script>
    const purchases = [];

    function addPurchase() {
      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);
      if (!amount || !rate) return alert("Please enter valid numbers.");

      const coins = amount / rate;
      purchases.push({ amount, rate, coins });

      const table = document.getElementById('purchaseTable');
      const row = table.insertRow();
      row.insertCell(0).innerText = "₹" + amount.toFixed(2);
      row.insertCell(1).innerText = "₹" + rate.toFixed(2);
      row.insertCell(2).innerText = coins.toFixed(6);

      document.getElementById('amount').value = '';
      document.getElementById('rate').value = '';

      updateSummary();
    }

    function updateSummary() {
      const totalInvestment = purchases.reduce((sum, p) => sum + p.amount, 0);
      const totalCoins = purchases.reduce((sum, p) => sum + p.coins, 0);
      const averagePrice = totalCoins > 0 ? totalInvestment / totalCoins : 0;

      document.getElementById('summaryTable').style.display = 'table';
      document.getElementById('totalInvestment').innerText = totalInvestment.toFixed(2);
      document.getElementById('totalCoins').innerText = totalCoins.toFixed(6);
      document.getElementById('avgPrice').innerText = averagePrice.toFixed(2);
    }

    function calculate() {
      if (purchases.length === 0) return alert("No purchases added.");
      const currentRate = parseFloat(document.getElementById('currentRate').value);
      if (!currentRate) return alert("Enter a current market rate.");

      const totalCoins = purchases.reduce((sum, p) => sum + p.coins, 0);
      const totalInvestment = purchases.reduce((sum, p) => sum + p.amount, 0);
      const currentValue = totalCoins * currentRate;
      const profitLoss = currentValue - totalInvestment;

      const resultText = `
        <strong>Current Rate:</strong> ₹${currentRate.toFixed(2)}<br/>
        <strong>Current Value:</strong> ₹${currentValue.toFixed(2)}<br/>
        <strong>${profitLoss >= 0 ? 'Profit' : 'Loss'}:</strong> ₹${profitLoss.toFixed(2)}
      `;

      document.getElementById('results').innerHTML = resultText;
    }

    function printData() {
      window.print();
    }

    async function fetchCurrentRate() {
      try {
        // Replace 'bitcoin' with any other coin ID from CoinGecko if needed
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=inr");
        const data = await res.json();
        const rate = data.bitcoin.inr;
        document.getElementById('currentRate').value = rate.toFixed(2);
        alert("Current market rate fetched successfully.");
      } catch (e) {
        alert("Failed to fetch market rate.");
      }
    }
  </script>

</body>
</html>
