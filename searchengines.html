<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Search Engines</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    .search-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .search-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
      width: 200px;
      transition: transform 0.3s ease;
    }
    .search-card:hover {
      transform: scale(1.05);
    }
    .search-card a {
      text-decoration: none;
      color: #0073e6;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Top Search Engines</h1>
  <div class="search-list">
    <div class="search-card">
      <a href="https://www.google.com" target="_blank">Google</a>
    </div>
    <div class="search-card">
      <a href="https://www.bing.com" target="_blank">Bing</a>
    </div>
    <div class="search-card">
      <a href="https://search.yahoo.com" target="_blank">Yahoo</a>
    </div>
    <div class="search-card">
      <a href="https://duckduckgo.com" target="_blank">DuckDuckGo</a>
    </div>
    <div class="search-card">
      <a href="https://www.ecosia.org" target="_blank">Ecosia</a>
    </div>
    <div class="search-card">
      <a href="https://www.startpage.com" target="_blank">Startpage</a>
    </div>
  </div>

</body>
</html>
