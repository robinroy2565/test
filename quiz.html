<!DOCTYPE html>
<html>
<head>
  <title>Question Entry Form</title>
</head>
<body>
  <h2>Enter a New Question</h2>

  <label for="subject">Subject:</label>
  <select id="subject">
    <option value="Math">Math</option>
    <option value="Science">Science</option>
    <option value="History">History</option>
  </select>
  <br><br>

  <label for="question">Question:</label>
  <input type="text" id="question" placeholder="Enter your question here">
  <br><br>

  <label>Option A:</label>
  <input type="text" id="optionA">
  <br><br>

  <label>Option B:</label>
  <input type="text" id="optionB">
  <br><br>

  <label>Option C:</label>
  <input type="text" id="optionC">
  <br><br>

  <label>Option D:</label>
  <input type="text" id="optionD">
  <br><br>

  <label for="answer">Correct Answer (A/B/C/D):</label>
  <input type="text" id="answer" maxlength="1">
  <br><br>

  <button onclick="submitData()">Submit</button>

  <script>
    function submitData() {
      const data = {
        subject: document.getElementById('subject').value,
        question: document.getElementById('question').value,
        options: {
          A: document.getElementById('optionA').value,
          B: document.getElementById('optionB').value,
          C: document.getElementById('optionC').value,
          D: document.getElementById('optionD').value
        },
        answer: document.getElementById('answer').value.toUpperCase()
      };

      console.log("Question Submitted:", data);
      alert("Question submitted successfully!");

      // Optional: You can save to localStorage or send to a server here
    }
  </script>
</body>
</html>
