<!DOCTYPE html>
<html>
<head>
  <title>Question Entry</title>
</head>
<body>
  <h2>Add a Question</h2>

  <label>Subject:</label>
  <select id="subject">
    <option value="Math">Math</option>
    <option value="Science">Science</option>
    <option value="History">History</option>
  </select><br><br>

  <label>Question:</label>
  <input type="text" id="question"><br><br>

  <label>Option A:</label>
  <input type="text" id="optionA"><br>
  <label>Option B:</label>
  <input type="text" id="optionB"><br>
  <label>Option C:</label>
  <input type="text" id="optionC"><br>
  <label>Option D:</label>
  <input type="text" id="optionD"><br><br>

  <label>Correct Answer (A/B/C/D):</label>
  <input type="text" id="answer" maxlength="1"><br><br>

  <button onclick="submitQuestion()">Submit</button>

  <h2>Saved Questions</h2>
  <div id="questions"></div>

  <script>
    function submitQuestion() {
      const questionData = {
        subject: document.getElementById('subject').value,
        question: document.getElementById('question').value,
        options: {
          A: document.getElementById('optionA').value,
          B: document.getElementById('optionB').value,
          C: document.getElementById('optionC').value,
          D: document.getElementById('optionD').value
        },
        answer: document.getElementById('answer').value.toUpperCase()
      };

      fetch('http://localhost:3000/api/questions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(questionData)
      })
      .then(res => res.json())
      .then(() => {
        alert('Question submitted!');
        loadQuestions(); // reload the list
      });
    }

    function loadQuestions() {
      fetch('http://localhost:3000/api/questions')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('questions');
          container.innerHTML = '';
          data.forEach((q, index) => {
            container.innerHTML += `
              <div>
                <strong>${index + 1}. ${q.subject}</strong> - ${q.question}<br>
                A: ${q.options.A}, B: ${q.options.B}, C: ${q.options.C}, D: ${q.options.D}<br>
                <b>Answer:</b> ${q.answer}<hr>
              </div>
            `;
          });
        });
    }

    // Load on page load
    loadQuestions();
  </script>
</body>
</html>
