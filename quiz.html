

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Application</title>
   <link href="style.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .table { margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }

    /* Popup Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      position: relative;
    }
    .close {
      position: absolute;
      right: 10px;
      top: 10px;
      cursor: pointer;
      font-size: 20px;
      color: #888;
    }
    .modal-content input {
      width: 100%;
      padding: 6px;
      margin: 5px 0;
    }
    button { margin: 5px; }
  </style>
</head>
<body>

  <h1>Quiz Application</h1>
  <button onclick="openModal()">Add New Quiz</button>

  <table id="quizTable">
    <thead>
      <tr>
        <th>ID</th><th>Subject</th><th>Question</th><th>A</th><th>B</th><th>C</th><th>D</th><th>Answer</th><th>Year</th><th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Popup Modal -->
  <div class="modal" id="quizModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle">Add/Edit Quiz</h2>
      <form id="quizForm">
      <h2>Quiz Settings</h2>
        <input type="hidden" id="quizId">
      <div class="column">
        <label for="subject">Subject:
          <select id="subject">
            <option value="">Select Subject</option>
            <option value="english">English</option>
            <option value="bengali">Bengali</option>
            <option value="mathematics">Mathematics</option>
            <option value="science">Science</option>
          </select>
        </label>
        <label for="chapter" id="chapter-div" style="display:none;">Chapter:
          <select id="chapter"></select>
        </label>
      </div>
      <label>Question: <input type="text" id="question" placeholder="Enter question"></label>
      <div class="column">
        <label>Option A: <input type="text" id="optionA"></label>
        <label>Option B: <input type="text" id="optionB"></label>
      </div>
      <div class="column">
        <label>Option C: <input type="text" id="optionC"></label>
        <label>Option D: <input type="text" id="optionD"></label>
      </div>
      <label>Answer: <input type="text" id="answer"></label>
      <button type="submit">Save</button>
    </form>
     
    </div>
  </div>

  <script>
    const chapters = {
  english: ["All Chapters", "Chapter 1", "Chapter 2"],
  bengali: ["All Chapters", "Chapter 1", "Chapter 2"],
  mathematics: ["All Chapters", "Chapter 1", "Chapter 2"],
  science: ["All Chapters", "Physics", "Chemistry"]
};

document.getElementById('subject').addEventListener('change', function() {
  const chapterDiv = document.getElementById('chapter-div');
  const chapterSelect = document.getElementById('chapter');
  chapterSelect.innerHTML = '';
  if (chapters[this.value]) {
    chapterDiv.style.display = 'block';
    chapters[this.value].forEach(ch => {
      chapterSelect.innerHTML += `<option value="${ch}">${ch}</option>`;
    });
  } else {
    chapterDiv.style.display = 'none';
  }
});
    const apiUrl = "https://script.google.com/macros/s/AKfycbwFNB6oGPsvz5Hn4DHse84by3d2IAfqmpRGx1hc7DxqYtwB7gwnnBnnSrshmByJmkwl/exec";

    const modal = document.getElementById("quizModal");
    const form = document.getElementById("quizForm");

    function openModal() {
      document.getElementById("modalTitle").innerText = "Add Quiz";
      form.reset();
      document.getElementById("quizId").value = "";
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
    }

    window.onclick = function(e) {
      if (e.target == modal) modal.style.display = "none";
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const quizId = document.getElementById('quizId').value;
      const data = {
        action: quizId ? "update" : "insert",
        id: quizId || null,
        subject: document.getElementById('subject').value,
        question: document.getElementById('question').value,
        optionA: document.getElementById('optionA').value,
        optionB: document.getElementById('optionB').value,
        optionC: document.getElementById('optionC').value,
        optionD: document.getElementById('optionD').value,
        answer: document.getElementById('answer').value.toUpperCase(),
        year: document.getElementById('year').value
      };

      const response = await fetch(apiUrl, { method: "POST", body: JSON.stringify(data) });
      const text = await response.text();
      alert(text);
      closeModal();
      loadQuizData();
    });

    async function loadQuizData() {
      const res = await fetch(apiUrl);
      const data = await res.json();
      const tbody = document.querySelector("#quizTable tbody");
      tbody.innerHTML = "";
      data.forEach(q => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${q.id}</td>
          <td>${q.subject}</td>
          <td>${q.question}</td>
          <td>${q.optionA}</td>
          <td>${q.optionB}</td>
          <td>${q.optionC}</td>
          <td>${q.optionD}</td>
          <td>${q.answer}</td>
          <td>${q.year}</td>
          <td>
            <button onclick="editQuiz('${q.id}')">Edit</button>
            <button onclick="deleteQuiz('${q.id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function editQuiz(id) {
      const res = await fetch(apiUrl);
      const data = await res.json();
      const quiz = data.find(q => q.id == id);
      if (quiz) {
        document.getElementById('modalTitle').innerText = "Edit Quiz";
        document.getElementById('quizId').value = quiz.id;
        document.getElementById('subject').value = quiz.subject;
        document.getElementById('question').value = quiz.question;
        document.getElementById('optionA').value = quiz.optionA;
        document.getElementById('optionB').value = quiz.optionB;
        document.getElementById('optionC').value = quiz.optionC;
        document.getElementById('optionD').value = quiz.optionD;
        document.getElementById('answer').value = quiz.answer;
        document.getElementById('year').value = quiz.year;
        modal.style.display = "flex";
      }
    }

    async function deleteQuiz(id) {
      if (!confirm("Are you sure you want to delete this quiz?")) return;
      const res = await fetch(apiUrl, { method: "POST", body: JSON.stringify({ action: "delete", id: id }) });
      const text = await res.text();
      alert(text);
      loadQuizData();
    }

    // Initial load
    loadQuizData();
  </script>

</body>
</html>
