<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Exam</title>
  <link rel="stylesheet" href="#" />
  <style>
    body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 0;
}

.container {
  width: 90%;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  background: white;
  margin-top: 30px;
  border-radius: 10px;
}

h1 {
  text-align: center;
}

.settings {
  text-align: center;
  margin-bottom: 20px;
}

.quiz {
  display: none;
}

.question-block {
  margin-bottom: 20px;
}

.result {
  font-weight: bold;
  text-align: center;
  margin-top: 20px;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz Exam</h1>

    <div class="settings">
      <label for="question-count">Number of Questions:</label>
      <select id="question-count">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="70">70</option>
        <option value="80">80</option>
        <option value="90">90</option>
        <option value="100">100</option>
        <option value="110">110</option>
      </select>
      <button onclick="startExam()">Start Exam</button>
    </div>

    <form id="quiz-form" class="quiz" onsubmit="submitQuiz(event)"></form>
    <div id="result" class="result"></div>
  </div>

  <script src="#"></script>
  <script>
    const quizForm = document.getElementById("quiz-form");
const resultDiv = document.getElementById("result");

function generateQuestion(id) {
  const correctAnswer = "A";
  const questionBlock = document.createElement("div");
  questionBlock.className = "question-block";

  const question = document.createElement("p");
  question.textContent = `Question ${id + 1}: What is the correct answer?`;

  questionBlock.appendChild(question);

  ["A", "B", "C", "D"].forEach((option) => {
    const label = document.createElement("label");
    label.innerHTML = `
      <input type="radio" name="q${id}" value="${option}" required />
      ${option}
    `;
    questionBlock.appendChild(label);
    questionBlock.appendChild(document.createElement("br"));
  });

  // Store correct answer for grading
  questionBlock.dataset.correct = correctAnswer;

  return questionBlock;
}

function startExam() {
  quizForm.innerHTML = "";
  resultDiv.innerHTML = "";
  const count = parseInt(document.getElementById("question-count").value);

  for (let i = 0; i < count; i++) {
    const question = generateQuestion(i);
    quizForm.appendChild(question);
  }

  const submitBtn = document.createElement("button");
  submitBtn.type = "submit";
  submitBtn.textContent = "Submit Exam";
  quizForm.appendChild(submitBtn);
  quizForm.style.display = "block";
}

function submitQuiz(event) {
  event.preventDefault();
  const questions = document.querySelectorAll(".question-block");
  let score = 0;

  questions.forEach((q, i) => {
    const correct = q.dataset.correct;
    const selected = quizForm[`q${i}`].value;
    if (selected === correct) score++;
  });

  resultDiv.textContent = `You scored ${score} out of ${questions.length}`;
}

  </script>
</body>
</html>
