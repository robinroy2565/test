<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sudoku Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    #sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
      margin-bottom: 10px;
    }

    input {
      width: 38px;
      height: 38px;
      text-align: center;
      font-size: 18px;
      border: 1px solid #ccc;
    }

    input:focus {
      outline: none;
      border-color: #007BFF;
    }

    input.readonly {
      background-color: #eee;
      font-weight: bold;
    }

    input.invalid {
      background-color: #ffcccc;
    }

    input:nth-child(1n) {
      border-right: 2px solid black;
    }
input:nth-child(2n) {
      border-right: 2px solid black;
    }
    input:nth-child(3n) {
      border-right: 2px solid black;
    }
    input:nth-child(n+19):nth-child(-n+27),
    input:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 2px solid black;
    }

    button {
      margin: 5px;
      padding: 10px 20px;
    }

    #sudoku-board input {
  width: 38px;
  height: 38px;
  text-align: center;
  font-size: 18px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

#sudoku-board input:focus {
  outline: none;
  border-color: #007BFF;
}

#sudoku-board input.readonly {
  background-color: #eee;
  font-weight: bold;
}

#sudoku-board input.invalid {
  background-color: #ffcccc;
}

/* 3x3 grid border styling */
#sudoku-board input {
  border: 1px solid #ccc;
}

#sudoku-board input:nth-child(3n) {
  border-right: 2px solid black; /* Every 3rd column */
}

#sudoku-board input:nth-child(n+19):nth-child(-n+27),
#sudoku-board input:nth-child(n+46):nth-child(-n+54),
#sudoku-board input:nth-child(n+73):nth-child(-n+81) {
  border-bottom: 2px solid black; /* Every 3rd row */
}

/* First column of each 3x3 box */
#sudoku-board input:nth-child(9n+1),
#sudoku-board input:nth-child(9n+4),
#sudoku-board input:nth-child(9n+7) {
  border-left: 2px solid black;
}

/* First row (1–9), 4–6, 7–9 to get top borders */
#sudoku-board input:nth-child(-n+9) {
  border-top: 2px solid black;
}

  </style>
</head>
<body>
  <h1>Sudoku</h1>
  <div id="sudoku-board"></div>
  <button onclick="startGame()">Start Game</button>
  <button onclick="clearBoard()">Clear Board</button>
  <button onclick="solveBoard()">Auto Solve</button>

  <script>
    const board = document.getElementById('sudoku-board');
    const inputs = [];

    function createBoard() {
      for (let i = 0; i < 81; i++) {
        const input = document.createElement('input');
        input.setAttribute('type', 'text');
        input.setAttribute('maxlength', '1');
        input.dataset.index = i;
        input.addEventListener('input', validateBoard);
        inputs.push(input);
        board.appendChild(input);
      }
    }

    function clearBoard() {
      inputs.forEach(input => {
        input.value = '';
        input.readOnly = false;
        input.classList.remove('readonly', 'invalid');
      });
    }

    function startGame() {
      inputs.forEach(input => {
        if (input.value !== '') {
          input.readOnly = true;
          input.classList.add('readonly');
        } else {
          input.readOnly = false;
        }
      });
      validateBoard();
    }

    function validateBoard() {
      inputs.forEach(input => input.classList.remove('invalid'));

      for (let i = 0; i < 81; i++) {
        const current = inputs[i];
        const val = current.value;
        if (val === '') continue;

        const row = Math.floor(i / 9);
        const col = i % 9;

        for (let j = 0; j < 9; j++) {
          const rowCell = inputs[row * 9 + j];
          const colCell = inputs[j * 9 + col];

          if (rowCell !== current && rowCell.value === val) current.classList.add('invalid');
          if (colCell !== current && colCell.value === val) current.classList.add('invalid');
        }

        const boxRow = Math.floor(row / 3) * 3;
        const boxCol = Math.floor(col / 3) * 3;

        for (let r = boxRow; r < boxRow + 3; r++) {
          for (let c = boxCol; c < boxCol + 3; c++) {
            const boxIndex = r * 9 + c;
            const boxCell = inputs[boxIndex];
            if (boxCell !== current && boxCell.value === val) current.classList.add('invalid');
          }
        }
      }
    }

    function getBoardArray() {
      const boardArray = [];
      for (let i = 0; i < 9; i++) {
        boardArray[i] = [];
        for (let j = 0; j < 9; j++) {
          const value = inputs[i * 9 + j].value;
          boardArray[i][j] = value === '' ? 0 : parseInt(value);
        }
      }
      return boardArray;
    }

    function setBoardArray(boardArray) {
      for (let i = 0; i < 9; i++) {
        for (let j = 0; j < 9; j++) {
          const index = i * 9 + j;
          if (!inputs[index].classList.contains('readonly')) {
            inputs[index].value = boardArray[i][j] !== 0 ? boardArray[i][j] : '';
          }
        }
      }
    }

    function isSafe(board, row, col, num) {
      for (let x = 0; x < 9; x++) {
        if (board[row][x] === num || board[x][col] === num) return false;
      }

      const startRow = row - (row % 3);
      const startCol = col - (col % 3);

      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          if (board[i + startRow][j + startCol] === num) return false;
        }
      }
      return true;
    }

    function solveSudoku(board) {
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          if (board[row][col] === 0) {
            for (let num = 1; num <= 9; num++) {
              if (isSafe(board, row, col, num)) {
                board[row][col] = num;
                if (solveSudoku(board)) return true;
                board[row][col] = 0;
              }
            }
            return false;
          }
        }
      }
      return true;
    }

    function solveBoard() {
      const boardArray = getBoardArray();
      if (solveSudoku(boardArray)) {
        setBoardArray(boardArray);
      } else {
        alert("No solution exists for this puzzle!");
      }
    }

    createBoard();
  </script>
</body>
</html>
