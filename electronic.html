<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive 3D Circuit Editor</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 {
  margin: 10px 0;
}
#circuitCanvas {
  width: 100vw;
  height: 90vh;
  display: block;
  overflow: hidden;
}

  </style>
</head>
<body>
  <h1>3D Circuit Diagram Editor</h1>
  <div id="circuitCanvas"></div>

  <script src="libs/three.min.js"></script>
  <script src=""></script>
  <script>
    let scene, camera, renderer;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let controls = [];
let selectedObject = null;
let offset = new THREE.Vector3();
let plane = new THREE.Plane();
let intersectPoint = new THREE.Vector3();

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 5, 10);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('circuitCanvas').appendChild(renderer.domElement);

  // Light
  const light = new THREE.PointLight(0xffffff, 1.2);
  light.position.set(10, 10, 10);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0x404040);
  scene.add(ambient);

  // Components
  createComponent('resistor', -2, 0, 0);
  createComponent('capacitor', 2, 0, 0);

  // Event Listeners
  renderer.domElement.addEventListener('mousedown', onMouseDown);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('mouseup', onMouseUp);
  window.addEventListener('resize', onWindowResize);
}

function createComponent(type, x, y, z) {
  let geometry, material, mesh;

  if (type === 'resistor') {
    geometry = new THREE.BoxGeometry(2, 0.5, 0.5);
    material = new THREE.MeshStandardMaterial({ color: 0xff5733 });
  } else if (type === 'capacitor') {
    geometry = new THREE.CylinderGeometry(0.3, 0.3, 1, 32);
    material = new THREE.MeshStandardMaterial({ color: 0x00ffff });
  }

  mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.userData = { type, isSelected: false };
  scene.add(mesh);
  controls.push(mesh);
}

function onMouseDown(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(controls);

  if (intersects.length > 0) {
    selectedObject = intersects[0].object;

    // Highlight
    selectedObject.material.emissive = new THREE.Color(0x333333);

    // For dragging
    plane.setFromNormalAndCoplanarPoint(
      camera.getWorldDirection(plane.normal),
      selectedObject.position
    );

    raycaster.ray.intersectPlane(plane, intersectPoint);
    offset.copy(intersectPoint).sub(selectedObject.position);
  }
}

function onMouseMove(event) {
  if (!selectedObject) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, intersectPoint);

  selectedObject.position.copy(intersectPoint.sub(offset));
}

function onMouseUp() {
  if (selectedObject) {
    // Remove highlight
    selectedObject.material.emissive.setHex(0x000000);
  }
  selectedObject = null;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

  </script>
</body>
</html>
