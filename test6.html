<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login & Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }
    .container {
      width: 400px;
    }
    form {
      background: #fff;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #registerForm {
      display: none;
    }
    .toggle-btn {
      background: #28a745;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="loginForm">
      <h2>Login</h2>
      <label>Mobile Number</label>
      <input type="text" id="loginMobile" required>

      <label>Password</label>
      <input type="password" id="loginPassword" required>

      <button type="submit">Login</button>
      <button type="button" class="toggle-btn" onclick="toggleRegister()">Create Account</button>
    </form>

    <form id="registerForm">
      <h2>Register</h2>

      <label>Name</label>
      <input type="text" id="regName" required>

      <label>Mobile Number</label>
      <input type="text" id="regMobile" required>

      <label>Verification Code</label>
      <input type="text" id="verifyMobile">

      <label>Password</label>
      <input type="password" id="regPassword" required>

      <label>Role</label>
      <select id="regRole" required>
        <option value="">Select Role</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
        <option value="user">User</option>
      </select>

      <label>Address</label>
      <input type="text" id="regAddress" required>

      <label>State</label>
      <select id="regState" onchange="populateDistricts()" required>
        <option value="">Select State</option>
        <option value="state1">State 1</option>
        <option value="state2">State 2</option>
      </select>

      <label>District</label>
      <select id="regDistrict" required>
        <option value="">Select District</option>
      </select>

      <label>PIN Code</label>
      <input type="text" id="regPin" required>

      <button type="submit">Register</button>
      <button type="button" class="toggle-btn" onclick="showLogin()">Back to Login</button>
    </form>
  </div>

  <script>
  function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
  }

  function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
  }

  // Initial display
  document.addEventListener('DOMContentLoaded', () => {
    showLogin(); // Show login by default
  });

  const districts = {
    state1: ["District A", "District B"],
    state2: ["District X", "District Y"]
  };

  function populateDistricts() {
    const state = document.getElementById('regState').value;
    const districtSelect = document.getElementById('regDistrict');
    districtSelect.innerHTML = '<option value="">Select District</option>';
    if (districts[state]) {
      districts[state].forEach(d => {
        const option = document.createElement('option');
        option.value = d;
        option.innerText = d;
        districtSelect.appendChild(option);
      });
    }
  }

  // Link button in Login form
  function toggleRegister() {
    showRegister();
  }
</script>

</body>
</html>
