<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isotope Reaction Simulator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: auto;
    }
    select, button {
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #e6f7ff;
      border: 1px solid #91d5ff;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Isotope Reaction Simulator</h2>
  <label for="isotope">Choose an Isotope:</label>
  <select id="isotope">
    <option value="Uranium-238">Uranium-238</option>
    <option value="Carbon-14">Carbon-14</option>
    <option value="Radon-222">Radon-222</option>
  </select>
  <button onclick="simulateReaction()">Simulate Reaction</button>

  <div id="result"></div>
</div>

<script>
  function simulateReaction() {
    const isotope = document.getElementById("isotope").value;
    let reaction = "";
    let result = "";

    if (isotope === "Uranium-238") {
      reaction = "U-238 → Th-234 + α (alpha decay)";
      result = "Thorium-234";
    } else if (isotope === "Carbon-14") {
      reaction = "C-14 → N-14 + β⁻ (beta decay)";
      result = "Nitrogen-14";
    } else if (isotope === "Radon-222") {
      reaction = "Rn-222 → Po-218 + α (alpha decay)";
      result = "Polonium-218";
    }

    document.getElementById("result").innerHTML = `
      <strong>Reaction:</strong> ${reaction}<br>
      <strong>Resulting Isotope:</strong> ${result}
    `;
  }
</script>

</body>
</html>
