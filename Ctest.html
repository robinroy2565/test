<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Cryptocurrency</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      color: #00ffcc;
    }

    label {
      font-size: 18px;
      display: block;
      margin-bottom: 10px;
    }

    #search-input {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
      background: #222;
      color: #fff;
    }

    select {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background: #222;
      color: #fff;
    }

    option {
      background: #222;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Select a Cryptocurrency</h1>

  <label for="search-input">Search Cryptocurrency:</label>
  <input type="text" id="search-input" placeholder="Type to filter...">

  <select id="crypto-select">
    <option>Loading...</option>
  </select>

  <script>
    const select = document.getElementById('crypto-select');
    const searchInput = document.getElementById('search-input');
    let allCoins = [];

    async function populateCryptoList() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/coins/list');
        const coins = await res.json();

        allCoins = coins.sort((a, b) => a.name.localeCompare(b.name));
        renderOptions(allCoins);
      } catch (err) {
        select.innerHTML = '<option>Error loading data</option>';
      }
    }

    function renderOptions(filteredCoins) {
      select.innerHTML = '';
      filteredCoins.forEach(coin => {
        const option = document.createElement('option');
        option.value = coin.id;
        option.textContent = `${coin.name} (${coin.symbol.toUpperCase()})`;
        select.appendChild(option);
      });
    }

    searchInput.addEventListener('input', () => {
      const keyword = searchInput.value.toLowerCase();
      const filtered = allCoins.filter(coin =>
        coin.name.toLowerCase().includes(keyword) ||
        coin.symbol.toLowerCase().includes(keyword)
      );
      renderOptions(filtered);
    });

    populateCryptoList();
  </script>
</body>
</html>
