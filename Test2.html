<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Prize Number Extractor</title>
  <link rel="stylesheet" href="">
  <style>
    body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f4f4f4;
}
.container {
  text-align: center;
}
#output {
  margin-top: 20px;
  text-align: left;
}
    
    /* Reset some defaults */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f4f8, #e2ebf0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px;
    }

    .settings {
      background: #ffffff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 600px;
      

    }
    .column {
      display: flex;
      column-gap: 15px;
    }
    /* .settings form {
       display: flex;
       flex-direction: column;
       align-items: center; 
    } */

    h2 {
      text-align: center;
      color: #2b6777;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 15px;
      font-weight: 600;
      color: #2b6777;
      font-size: 1rem;
      text-align: left;
    }


    input[type="text"], select {
      width: 100%;
      padding: 15px;
      border: 1px solid #b0c4de;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 16px;
      background-color: #f9f9f9;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #52ab98;
      box-shadow: 0 0 5px rgba(82, 171, 152, 0.5);
    }

    button {
      width: 50%;
      align-items: center;
      padding: 12px;
      margin-left: 24%;
      background-color: #52ab98;
      color: white;
      border: none;
      border-radius: 8px;

      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #3b7f7a;
    }

    .timer {
      text-align: center;
      font-weight: bold;
      color: #ff5e57;
      font-size: 18px;
      margin-top: 20px;
    }

    #chapter-div {
      margin-top: 15px;
    }

    .quiz {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-top: 20px;
      display: none; /* Show only when quiz starts */
    }

    .result {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Prize Number Extractor</h1>
    <input type="file" id="pdfUpload" accept="application/pdf">
    <button onclick="uploadFile()">Upload PDF</button>
    <div id="output"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="">
      function uploadFile() {
  const fileInput = document.getElementById('pdfUpload');
  const file = fileInput.files[0];
  if (file && file.type === 'application/pdf') {
    const reader = new FileReader();
    reader.onload = function(e) {
      const typedarray = new Uint8Array(e.target.result);
      pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
        let textContent = '';
        const numPages = pdf.numPages;
        let count = 0;
        for (let i = 1; i <= numPages; i++) {
          pdf.getPage(i).then(function(page) {
            page.getTextContent().then(function(text) {
              text.items.forEach(function(item) {
                textContent += item.str + ' ';
              });
              count++;
              if (count === numPages) {
                extractPrizeNumbers(textContent);
              }
            });
          });
        }
      });
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Please upload a valid PDF file.');
  }
}

function extractPrizeNumbers(text) {
  const prizeNumberRegex = /\d+/g;
  const prizeNumbers = text.match(prizeNumberRegex);
  if (prizeNumbers) {
    displayPrizeNumbers(prizeNumbers);
    saveToGoogleSheets(prizeNumbers);
  } else {
    document.getElementById('output').innerText = 'No prize numbers found.';
  }
}

function displayPrizeNumbers(prizeNumbers) {
  const output = document.getElementById('output');
  output.innerHTML = '<h2>Extracted Prize Numbers:</h2>';
  prizeNumbers.forEach(function(number) {
    output.innerHTML += `<p>${number}</p>`;
  });
}

function saveToGoogleSheets(prizeNumbers) {
  const url = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';
  prizeNumbers.forEach(function(number) {
    fetch(url, {
      method: 'POST',
      contentType: 'application/json',
      body: JSON.stringify({ prizeNumber: number })
    })
    .then(response => response.json())
    .then(data => {
      console.log('Data saved:', data);
    })
    .catch(error => {
      console.error('Error saving data:', error);
    });
  });
}

  </script>
</body>
</html>
