<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prize Number Extractor</title>
<!--   <link href="style.css" rel="stylesheet"> -->
  <style>
    body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f4f4f4;
}
.container {
  text-align: center;
}
#output {
  margin-top: 20px;
  text-align: left;
}
    /* Reset some defaults */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Body Styling */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(to right, #f7f9fc, #e2e8f0);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Main container */
.container {
  background-color: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  text-align: center;
  width: 400px;
  max-width: 90%;
}

/* Title */
.container h1 {
  margin-bottom: 24px;
  font-size: 24px;
  color: #333;
}

/* File input */
input[type="file"] {
  display: block;
  margin: 0 auto 16px auto;
  padding: 10px;
  font-size: 16px;
}

/* Button */
button {
  padding: 10px 20px;
  font-size: 16px;
  background-color: #4CAF50;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #388e3c;
}

/* Output box */
#output {
  margin-top: 30px;
  text-align: left;
  max-height: 300px;
  overflow-y: auto;
  padding: 10px;
  background-color: #f1f1f1;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* Output heading */
#output h2 {
  margin-bottom: 12px;
  font-size: 18px;
  color: #222;
}

/* Output numbers */
#output p {
  font-size: 16px;
  margin: 4px 0;
  padding-left: 8px;
  color: #333;
  border-left: 3px solid #4CAF50;
}

   
  </style>
</head>
<body>
  <div class="container">
    <h1>Prize Number Extractor</h1>
    <input type="file" id="pdfUpload" accept="application/pdf">
    <button onclick="uploadFile()">Upload PDF</button>
    <div id="output"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="">
      function uploadFile() {
  const fileInput = document.getElementById('pdfUpload');
  const file = fileInput.files[0];
  if (file && file.type === 'application/pdf') {
    const reader = new FileReader();
    reader.onload = function(e) {
      const typedarray = new Uint8Array(e.target.result);
      pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
        let textContent = '';
        const numPages = pdf.numPages;
        let count = 0;
        for (let i = 1; i <= numPages; i++) {
          pdf.getPage(i).then(function(page) {
            page.getTextContent().then(function(text) {
              text.items.forEach(function(item) {
                textContent += item.str + ' ';
              });
              count++;
              if (count === numPages) {
                extractPrizeNumbers(textContent);
              }
            });
          });
        }
      });
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('Please upload a valid PDF file.');
  }
}

function extractPrizeNumbers(text) {
  const prizeNumberRegex = /\d+/g;
  const prizeNumbers = text.match(prizeNumberRegex);
  if (prizeNumbers) {
    displayPrizeNumbers(prizeNumbers);
    saveToGoogleSheets(prizeNumbers);
  } else {
    document.getElementById('output').innerText = 'No prize numbers found.';
  }
}

function displayPrizeNumbers(prizeNumbers) {
  const output = document.getElementById('output');
  output.innerHTML = '<h2>Extracted Prize Numbers:</h2>';
  prizeNumbers.forEach(function(number) {
    output.innerHTML += `<p>${number}</p>`;
  });
}

function saveToGoogleSheets(prizeNumbers) {
  const url = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';
  prizeNumbers.forEach(function(number) {
    fetch(url, {
      method: 'POST',
      contentType: 'application/json',
      body: JSON.stringify({ prizeNumber: number })
    })
    .then(response => response.json())
    .then(data => {
      console.log('Data saved:', data);
    })
    .catch(error => {
      console.error('Error saving data:', error);
    });
  });
}

  </script>
</body>
</html>
